apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: techwise-site
resources:
  - k8s/namespace.yaml
  - k8s/site.yaml
configMapGenerator:
  - name: techwise-site-assets
    files:
      - index.html
      - styles.css
      - app.js
      - portfolio-index.html=portfolio/index.html
      - default.conf=k8s/default.conf
