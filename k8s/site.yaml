apiVersion: apps/v1
kind: Deployment
metadata:
  name: techwise-site
  labels:
    app: techwise-site
spec:
  replicas: 2
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: techwise-site
  template:
    metadata:
      labels:
        app: techwise-site
    spec:
      containers:
        - name: web
          image: nginx:1.27-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
            timeoutSeconds: 1
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
            timeoutSeconds: 1
          volumeMounts:
            - name: site-assets
              mountPath: /usr/share/nginx/html
              readOnly: true
            - name: nginx-config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
              readOnly: true
      volumes:
        - name: site-assets
          configMap:
            name: techwise-site-assets
            items:
              - key: index.html
                path: index.html
              - key: styles.css
                path: styles.css
              - key: app.js
                path: app.js
              - key: portfolio-index.html
                path: portfolio/index.html
        - name: nginx-config
          configMap:
            name: techwise-site-assets
            items:
              - key: default.conf
                path: default.conf
---
apiVersion: v1
kind: Service
metadata:
  name: techwise-site
  labels:
    app: techwise-site
spec:
  type: ClusterIP
  selector:
    app: techwise-site
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: techwise-site
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
spec:
  ingressClassName: traefik
  rules:
    - host: techwise.josecjr.work
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: techwise-site
                port:
                  number: 80
